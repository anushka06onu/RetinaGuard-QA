[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinaguard-qa"
version = "1.0.0"
description = "An uncertainty-aware, device-robust quality assurance and capture-feedback system for retinal fundus imaging"
authors = [{ name = "Fateha Hossain Anushka" }]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "retinal-fundus-imaging",
    "image-quality-assessment",
    "uncertainty-estimation",
    "out-of-distribution-detection",
    "medical-computer-vision",
    "selective-prediction",
    "robustness"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.1.0",
    "scikit-image>=0.19.0",
    "pillow>=9.2.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.2",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "onnxscript>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "imagehash>=4.3.1",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
    "httpx>=0.24.0",
    "onnxscript>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
python_files = ["test_*.py"]
pythonpath = [".", "src"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py39', 'py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]


