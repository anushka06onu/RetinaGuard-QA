data:
  image_size: [384, 384]
  num_channels: 3
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  
  classes:
    quality_grades:
      - "Good"
      - "Usable"
      - "Reject"
    defects:
      - "Severe Blur / Focus Loss"
      - "Underexposure"
      - "Overexposure"
      - "Uneven Illumination / Shadowing"
      - "Field Truncation / Off-Center"
      - "Optical Artifacts / Lens Smear"

  datasets:
    eyeq:
      name: "EyeQ"
      source_url: "https://github.com/hzfu/eyeq"
      license: "Research & Non-commercial"
      total_samples: 28792
      patient_level_split: true
    deepdrid:
      name: "DeepDRiD Challenge"
      source_url: "https://github.com/deepdrdoc/DeepDRiD"
      license: "Challenge Data License"
      is_external_benchmark: true

  preprocessing:
    canonical_fov_crop: true
    fov_tolerance: 0.05
    apply_clahe: false
    clahe_clip_limit: 2.0
    color_normalization: "none" # options: "none", "graham", "reinhard"
