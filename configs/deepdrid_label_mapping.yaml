# DeepDRiD Dataset Label Specifications & Ordinal Mappings
# Source: DeepDRiD Challenge (ISBI 2020 Challenge 5: Diabetic Retinopathy Assessment Grading and Diagnosis)
# Publication: Liu et al., Patterns 2022 (doi: 10.1016/j.patter.2022.100512)
# Repository: https://github.com/deepdrdoc/DeepDRiD

dataset: "DeepDRiD"
description: "Regular fundus image quality, artifact, clarity, and field definition attributes"

# Official Raw Column Names from Challenge CSVs:
raw_column_names:
  image_id:
    - "image_id"
    - "image"
    - "Image_id"
    - "Image"
  overall_quality:
    - "overall_quality"
    - "Overall quality"
    - "Overall_quality"
    - "quality"
  artifact:
    - "artifact"
    - "Artifact"
    - "artifacts"
  clarity:
    - "clarity"
    - "Clarity"
  field_definition:
    - "field_definition"
    - "Field definition"
    - "Field_definition"
    - "field_def"

# 1. Overall Quality
# Official Definition:
# 0 = Quality is not good enough for diagnosis of retinal diseases (Reject / Unusable)
# 1 = Quality is good enough for diagnosis of retinal diseases (Diagnosable / Good)
overall_quality:
  description: "Global acquisition grade for clinical reading (0=not diagnosable/reject, 1=diagnosable/good)"
  scale_type: "categorical"
  accepted_raw_values:
    - 0
    - 1
    - 2
    - "0"
    - "1"
    - "2"
    - "Good"
    - "Usable"
    - "Reject"
    - "good"
    - "usable"
    - "reject"
  canonical_mapping:
    0: "reject"
    1: "good"
    2: "reject"
    "0": "reject"
    "1": "good"
    "2": "reject"
    "Good": "good"
    "Usable": "usable"
    "Reject": "reject"
    "good": "good"
    "usable": "usable"
    "reject": "reject"

# 2. Artifacts
# Official Scale: 0=None, 1=Outside arch <1/4, 4=Non-macular <1/4, 6=Cover 1/4-1/2, 8=Cover >1/2, 10=Entire pole
# Canonical Direction: 0 = None / Negligible, 1 = Mild / Moderate, 2 = Severe / Obstructing
artifact:
  description: "Presence of optical dust, reflection, eyelashes, or camera smudge"
  scale_type: "ordinal"
  accepted_raw_values: [0, 1, 2, 3, 4, 6, 8, 10, "0", "1", "2", "3", "4", "6", "8", "10"]
  canonical_mapping:
    0: 0
    1: 1
    2: 1
    4: 1
    3: 2
    6: 2
    8: 2
    10: 2
    "0": 0
    "1": 1
    "2": 1
    "4": 1
    "3": 2
    "6": 2
    "8": 2
    "10": 2
  levels:
    0: "None / Negligible (raw 0)"
    1: "Mild / Moderate (raw 1, 2, 4)"
    2: "Severe / Extreme (raw 3, 6, 8, 10)"

# 3. Clarity
# Official Scale: 1=Level 1 arch only (severe blur), 4=Level 2 arch & few lesions, 6=Level 3 arch & some lesions, 8=Level 3 arch & most lesions, 10=Level 3 arch & all lesions
# Canonical Direction: 0 = High Clarity (Sharp), 1 = Moderate Clarity, 2 = Low Clarity / Severe Defocus
clarity:
  description: "Optical sharpness and vascular edge contrast"
  scale_type: "ordinal"
  accepted_raw_values: [0, 1, 2, 3, 4, 6, 8, 10, "0", "1", "2", "3", "4", "6", "8", "10"]
  canonical_mapping:
    10: 0
    8: 0
    0: 0
    6: 1
    4: 1
    2: 1
    1: 2
    3: 2
    "10": 0
    "8": 0
    "0": 0
    "6": 1
    "4": 1
    "2": 1
    "1": 2
    "3": 2
  levels:
    0: "High / Good clarity (raw 8, 10, 0)"
    1: "Moderate clarity (raw 4, 6, 2)"
    2: "Low clarity / Severe blur (raw 1, 3)"

# 4. Field Definition
# Official Scale: 1=Missing disc & macula, 4=Only disc or macula, 6=Both disc & macula, 8=Within 2PD, 10=Within 1PD
# Canonical Direction: 0 = Adequate (Standard FOV complete), 1 = Acceptable (Minor clipping), 2 = Poor (Major landmark missing)
field_definition:
  description: "Completeness of retinal field coverage (macula + optic disc centration)"
  scale_type: "ordinal"
  accepted_raw_values: [0, 1, 2, 3, 4, 6, 8, 10, "0", "1", "2", "3", "4", "6", "8", "10"]
  canonical_mapping:
    10: 0
    8: 0
    0: 0
    6: 1
    2: 1
    4: 2
    1: 2
    3: 2
    "10": 0
    "8": 0
    "0": 0
    "6": 1
    "2": 1
    "4": 2
    "1": 2
    "3": 2
  levels:
    0: "Adequate (raw 8, 10, 0)"
    1: "Acceptable / Minor clipping (raw 6, 2)"
    2: "Poor / Landmark missing (raw 1, 4, 3)"

