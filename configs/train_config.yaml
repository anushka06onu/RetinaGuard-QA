training:
  seed: 42
  batch_size: 32
  num_epochs: 25
  learning_rate: 0.0003
  weight_decay: 0.0001
  optimizer: "adamw"
  lr_scheduler: "cosine"
  warmup_epochs: 3
  mixed_precision: true
  
  loss:
    grade_loss: "focal_or_ce" # with label smoothing
    label_smoothing: 0.05
    defect_loss: "bce_with_logits"
    score_loss: "smooth_l1"

  augmentation:
    random_crop_scale: [0.85, 1.0]
    horizontal_flip: true
    vertical_flip: true
    rotation_degrees: 180
    color_jitter:
      brightness: 0.15
      contrast: 0.15
      saturation: 0.1
      hue: 0.05

  early_stopping:
    patience: 7
    monitor: "val_macro_f1"
    mode: "max"
