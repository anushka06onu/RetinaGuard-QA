# EyeQ Single-Task Baseline Training Configuration
experiment:
  name: "eyeq_baseline"
  seed: 2026
  seeds: [2026, 2027, 2028]

data:
  datasets:
    eyeq:
      enabled: true
      train_split: "data/splits/eyeq_train.csv"
      val_split: "data/splits/eyeq_val.csv"
    deepdrid:
      enabled: false

model:
  backbone: "mobilenetv3_large_100" # options: "mobilenetv3_large_100", "efficientnet_b0"
  pretrained: true
  num_classes: 3
  dropout: 0.2
  latent_dim: 128

training:
  image_size: 384
  epochs: 40
  batch_size: 32
  num_workers: 2
  optimizer: "adamw"
  learning_rate: 0.0003
  weight_decay: 0.0001
  scheduler: "cosine"
  mixed_precision: true
  early_stopping_patience: 7
  selection_metric: "quality_macro_f1"

loss:
  type: "cross_entropy"
  label_smoothing: 0.05

