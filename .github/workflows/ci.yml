name: RetinaGuard-QA CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Pytest Suite with Coverage
      run: |
        PYTHONPATH=. pytest tests/ -v --cov=src/retinaguard --cov-fail-under=70

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Linters
      run: |
        pip install ruff black mypy
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check src/ api/ scripts/ tests/

    - name: Format Check with Black
      run: black --check src/ api/ scripts/ tests/

    - name: Type Check with Mypy
      run: mypy src/ api/ --ignore-missing-imports

  frontend-build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: web/package-lock.json

    - name: Install, Test and Build Frontend
      run: |
        cd web
        npm ci
        npm test
        npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Build API Container
      run: |
        docker build -f Dockerfile.api -t retinaguard-api:test .

    - name: Build Web Container
      run: |
        docker build -f web/Dockerfile -t retinaguard-web:test web/
