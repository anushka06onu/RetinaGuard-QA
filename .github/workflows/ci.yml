name: RetinaGuard-QA CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Pytest Suite with Coverage
      run: |
        PYTHONPATH=src:. pytest tests/ api/tests/ -v --cov=src/retinaguard --cov=api --cov-fail-under=70

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Linters
      run: |
        pip install ruff black mypy
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check src/ api/ scripts/ tests/

    - name: Format Check with Black
      run: black --check src/ api/ scripts/ tests/

    - name: Type Check with Mypy
      run: mypy --explicit-package-bases src/ api/ --ignore-missing-imports

  artifact-verification:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify Split Cryptographic Provenance
      run: |
        python scripts/verify_splits.py --provenance-file data/splits_provenance.json --splits-dir data/splits

    - name: Verify Artifact Checksums and Lineage Invariants
      run: |
        python scripts/verify_artifacts.py --manifest artifacts/provenance/SHA256SUMS --artifacts-dir artifacts

  frontend-build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: web/package-lock.json

    - name: Install, Test and Build Frontend
      run: |
        cd web
        npm ci
        npm test
        npm run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Build API Container
      run: |
        docker build -f Dockerfile.api -t retinaguard-api:test .

    - name: Test API Container Startup & Health
      run: |
        docker run -d --name retinaguard-api-test -p 8000:8000 retinaguard-api:test
        sleep 5
        curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health/live
        curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health/ready
        docker stop retinaguard-api-test && docker rm retinaguard-api-test

    - name: Build Web Container
      run: |
        docker build -f web/Dockerfile -t retinaguard-web:test web/

  full-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: web/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: web
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: web
      run: npx playwright install --with-deps chromium

    - name: Start Full Stack with Docker Compose
      run: docker compose up -d --build

    - name: Wait for Backend and Frontend Services
      run: |
        curl --fail --retry 15 --retry-delay 3 http://localhost:8000/health/ready
        curl --fail --retry 15 --retry-delay 3 http://localhost:3000/health/ready
        curl --fail --retry 15 --retry-delay 3 http://localhost:3000/

    - name: Run Playwright E2E Tests
      working-directory: web
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:3000
      run: npm run test:e2e

    - name: Upload Playwright Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: web/playwright-report/
        retention-days: 7

    - name: Teardown Docker Compose
      if: always()
      run: docker compose down -v
