version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=production
      - MODEL_PATH=artifacts/models/model.onnx
      - PREPROCESSING_PATH=artifacts/models/preprocessing.json
      - CALIBRATION_PATH=artifacts/models/calibration_metadata.json
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

